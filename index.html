<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kulukirja</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF1EA; --paper2:#E4E7DD; --ink:#1F2A24; --ink-soft:#54615A;
  --line:#CBD1C4; --green:#2F6B4F; --green-dark:#204B37; --gold:#B8912B;
  --red:#A8452F;
  --c-asuminen:#2F6B4F; --c-ruoka:#B8912B; --c-liikenne:#3E6E8E;
  --c-viihde:#8A4B6E; --c-terveys:#A8452F; --c-vaatteet:#6B6E3E; --c-muut:#7C7C74;
  --c-edenred:#D9822B; --c-liikunta:#1F9E89;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1F1B; --paper2:#242923; --ink:#EAEDE6; --ink-soft:#9BA69B; --line:#3A413A;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1F1B; --paper2:#242923; --ink:#EAEDE6; --ink-soft:#9BA69B; --line:#3A413A;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Inter,system-ui,sans-serif; line-height:1.45;
  min-height:100%;
}
.wrap{max-width:980px; margin:0 auto; padding:36px 20px 60px;}
header{display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:28px; flex-wrap:wrap;}
h1{font-family:"Source Serif 4",Georgia,serif; font-weight:700; font-size:28px; margin:0;}
h1 span{color:var(--green);}
.month-nav{display:flex; align-items:center; gap:10px; font-family:"IBM Plex Mono",monospace; font-size:14px;}
.month-nav button{
  background:none; border:1px solid var(--line); color:var(--ink); border-radius:6px;
  width:30px; height:30px; cursor:pointer; font-size:15px;
}
.month-label{min-width:120px; text-align:center; font-weight:600;}

.grid{display:grid; grid-template-columns:340px 1fr; gap:24px;}
@media (max-width:760px){ .grid{grid-template-columns:1fr;} }

.card{
  background:var(--paper2); border:1px solid var(--line); border-radius:10px; padding:20px;
}
.card + .card{margin-top:20px;}
.card h2{font-family:"Source Serif 4",serif; font-size:16px; margin:0 0 14px; font-weight:700;}

label{display:block; font-size:12.5px; color:var(--ink-soft); margin:12px 0 5px;}
label:first-of-type{margin-top:0;}
input, select{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px;
  background:var(--paper); color:var(--ink); font-family:Inter,sans-serif; font-size:14.5px;
}
input:focus, select:focus{outline:2px solid var(--green); outline-offset:1px;}
input[type=number]{font-family:"IBM Plex Mono",monospace;}

.cat-hint{font-size:12px; color:var(--ink-soft); margin-top:6px; min-height:16px;}
.cat-hint b{color:var(--ink);}

button.primary{
  margin-top:16px; width:100%; padding:11px; border:none; border-radius:6px;
  background:var(--green); color:#fff; font-weight:600; font-size:14.5px; cursor:pointer;
}
button.primary:hover{background:var(--green-dark);}

.total-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; flex-wrap:wrap; gap:14px;}
.total-row .amt{font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:600;}
.total-row .lbl{font-size:13px; color:var(--ink-soft);}
.forecast{text-align:right;}
.forecast .amt{font-size:19px; color:var(--gold);}

.bar-row{margin-bottom:12px;}
.bar-row .top{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px;}
.bar-row .top .amt{font-family:"IBM Plex Mono",monospace;}
.bar-track{height:8px; background:var(--paper); border-radius:4px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; border-radius:4px;}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px;}

.entries{list-style:none; margin:0; padding:0;}
.entries li{
  display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:12px;
  padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;
}
.entries li:last-child{border-bottom:none;}
.entries .date{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}
.entries .desc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.entries .cat-pill{
  font-size:11.5px; padding:3px 9px; border-radius:100px; white-space:nowrap; color:#fff;
}
.entries .amt{font-family:"IBM Plex Mono",monospace; font-weight:600; white-space:nowrap;}
.entries .del{
  background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:2px 6px;
}
.entries .del:hover{color:var(--red);}
.empty{color:var(--ink-soft); font-size:14px; padding:20px 0; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kulu<span>kirja</span></h1>
    <div class="month-nav">
      <button id="prevM" aria-label="Edellinen kuukausi">←</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextM" aria-label="Seuraava kuukausi">→</button>
    </div>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Uusi kirjaus</h2>
        <label for="f-date">Päivämäärä</label>
        <input type="date" id="f-date">
        <label for="f-desc">Kuvaus</label>
        <input type="text" id="f-desc" placeholder="esim. K-Market, Elisa lasku...">
        <label for="f-amount">Summa (€)</label>
        <input type="number" id="f-amount" step="0.01" min="0" placeholder="0.00">
        <label for="f-cat">Kategoria</label>
        <select id="f-cat">
          <option value="Asuminen">Asuminen</option>
          <option value="Terveys">Terveys</option>
          <option value="Liikenne">Liikenne</option>
          <option value="Viihde">Viihde</option>
          <option value="Edenred">Edenred</option>
          <option value="Liikunta">Liikunta</option>
          <option value="Vaatteet">Vaatteet</option>
          <option value="Ruoka">Ruoka</option>
          <option value="Muut">Muut</option>
        </select>
        <div class="cat-hint" id="catHint"></div>
        <button class="primary" id="addBtn">Lisää kirjaus</button>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="total-row">
          <div>
            <div class="lbl">Kuukauden kulut yhteensä</div>
            <div class="amt" id="totalAmt">0,00 €</div>
          </div>
          <div class="forecast" id="forecastBox" style="display:none">
            <div class="lbl" id="forecastLbl">Ennuste koko kuulle</div>
            <div class="amt" id="forecastAmt">0,00 €</div>
          </div>
        </div>
        <div id="bars"></div>
      </div>
      <div class="card">
        <h2>Kirjaukset</h2>
        <ul class="entries" id="entryList"></ul>
      </div>
    </div>
  </div>
</div>

<script>
const CATS = ["Asuminen","Terveys","Liikenne","Viihde","Edenred","Liikunta","Vaatteet","Ruoka","Muut"];
const CAT_COLOR = {
  Asuminen:"var(--c-asuminen)", Ruoka:"var(--c-ruoka)", Liikenne:"var(--c-liikenne)",
  Viihde:"var(--c-viihde)", Terveys:"var(--c-terveys)", Vaatteet:"var(--c-vaatteet)", Muut:"var(--c-muut)",
  Edenred:"var(--c-edenred)", Liikunta:"var(--c-liikunta)"
};
// Kategorioiden erikoissäännöt kulun laskentaan
// Edenred: ensimmäisestä 14 eurosta lasketaan mukaan vain 75%, 14 euron ylittävä osa lasketaan täysimääräisenä
function effectiveAmount(e){
  if (e.category === 'Edenred'){
    const capped = Math.min(e.amount, 14);
    const over = Math.max(e.amount - 14, 0);
    return capped * 0.75 + over;
  }
  return e.amount;
}

// Avainsanat -> kategoria (tarkistetaan järjestyksessä, ensimmäinen osuma voittaa).
// Ruoka tarkistetaan ennen Liikennettä, jotta esim. "Uber Eats" osuu Ruokaan eikä Liikenteen "uber"-sanaan.
const KEYWORDS = [
  ["Asuminen", ["vuokra","vastike","sähkö","sahko","vesimaksu","korko","internet","netti","kaukolämpö","kaukolampo","asuntolaina","yhtiövastike","yhtiovastike","lämmitys","lammitys","laina","lyhennys"]],
  ["Terveys", ["apteekki","lääkäri","laakari","hammas","fysioterapia","terveys","optikko","lääke","yths"]],
  ["Ruoka", ["ruoka","kauppa","market","prisma","lidl","alepa","sale","citymarket","ravintola","kahvila","pizza","wolt","foodora","uber eats"]],
  ["Liikenne", ["bensa","polttoaine","hsl","juna","bussi","taksi","parkki","pysäköinti","pysakointi","autovakuutus","katsastus","abc","vr","bolt","uber"]],
  ["Viihde", ["netflix","spotify","hbo","elokuva","konsertti","peli","steam","disney+","viihde","teatteri","kalja","olut"]],
  ["Edenred", ["edenred"]],
  ["Liikunta", ["kuntosali","sali","liikunta"]],
  ["Vaatteet", ["h&m","zara","vaatteet","kengät","kengat","asusteet","vaateliike","vaate","zalando","suit"]],
];

function guessCategory(desc){
  const d = desc.toLowerCase();
  for (const [cat, words] of KEYWORDS){
    if (words.some(w => d.includes(w))) return cat;
  }
  return "Muut";
}

function fmtEUR(n){
  return n.toLocaleString('fi-FI', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

let entries = [];
let viewDate = new Date();
viewDate.setDate(1);

function storageKey(){ return 'kulukirja:entries'; }

function load(){
  try{
    const raw = localStorage.getItem(storageKey());
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){ entries = []; }
}
function save(){
  try{ localStorage.setItem(storageKey(), JSON.stringify(entries)); }
  catch(e){ console.error('Tallennus epäonnistui', e); }
}

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

const MONTH_NAMES = ["tammikuu","helmikuu","maaliskuu","huhtikuu","toukokuu","kesäkuu","heinäkuu","elokuu","syyskuu","lokakuu","marraskuu","joulukuu"];

function renderMonthLabel(){
  document.getElementById('monthLabel').textContent = MONTH_NAMES[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
}

function renderAll(){
  renderMonthLabel();
  const mk = monthKey(viewDate);
  const monthEntries = entries.filter(e => e.date.startsWith(mk)).sort((a,b)=> b.date.localeCompare(a.date));

  // Total + bars
  const total = monthEntries.reduce((s,e)=>s+effectiveAmount(e),0);
  document.getElementById('totalAmt').textContent = fmtEUR(total);

  // Ennuste: vain kun tarkastelussa on kuluva kuukausi
  const forecastBox = document.getElementById('forecastBox');
  const today = new Date();
  const isCurrentMonth = viewDate.getFullYear() === today.getFullYear() && viewDate.getMonth() === today.getMonth();
  if (isCurrentMonth && total > 0){
    const daysElapsed = today.getDate();
    const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
    const projected = (total / daysElapsed) * daysInMonth;
    document.getElementById('forecastAmt').textContent = fmtEUR(projected);
    document.getElementById('forecastLbl').textContent = `Ennuste koko kuulle (pv ${daysElapsed}/${daysInMonth})`;
    forecastBox.style.display = '';
  } else {
    forecastBox.style.display = 'none';
  }

  const byCat = {};
  CATS.forEach(c=>byCat[c]=0);
  monthEntries.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + effectiveAmount(e); });

  const barsEl = document.getElementById('bars');
  barsEl.innerHTML = '';
  CATS.forEach(cat=>{
    const amt = byCat[cat] || 0;
    if (amt === 0 && monthEntries.length > 0) return;
    const pct = total > 0 ? (amt/total*100) : 0;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="top">
        <span><span class="dot" style="background:${CAT_COLOR[cat]}"></span>${cat}</span>
        <span class="amt">${fmtEUR(amt)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${CAT_COLOR[cat]}"></div></div>
    `;
    barsEl.appendChild(row);
  });
  if (monthEntries.length === 0){
    barsEl.innerHTML = '<div class="empty">Ei kirjauksia tälle kuukaudelle vielä.</div>';
  }

  // List
  const listEl = document.getElementById('entryList');
  listEl.innerHTML = '';
  if (monthEntries.length === 0){
    listEl.innerHTML = '<li class="empty" style="display:block">Lisää ensimmäinen kirjaus vasemmalta.</li>';
  } else {
    monthEntries.forEach(e=>{
      const li = document.createElement('li');
      const d = new Date(e.date);
      const dateStr = d.toLocaleDateString('fi-FI', {day:'2-digit', month:'2-digit'});
      const eff = effectiveAmount(e);
      const note = eff !== e.amount
        ? `<br><small style="font-weight:400;color:var(--ink-soft);font-size:11px">→ ${fmtEUR(eff)} laskettuna</small>`
        : '';
      li.innerHTML = `
        <span class="date">${dateStr}</span>
        <span class="desc">${escapeHtml(e.desc)}</span>
        <span class="cat-pill" style="background:${CAT_COLOR[e.category]}">${e.category}</span>
        <span class="amt">${fmtEUR(e.amount)}${note}</span>
        <button class="del" data-id="${e.id}" aria-label="Poista">✕</button>
      `;
      listEl.appendChild(li);
    });
  }
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

document.getElementById('f-desc').addEventListener('input', (e)=>{
  const val = e.target.value.trim();
  const hint = document.getElementById('catHint');
  if (val.length < 2){ hint.textContent=''; return; }
  const guess = guessCategory(val);
  document.getElementById('f-cat').value = guess;
  hint.innerHTML = 'Ehdotettu kategoria: <b>' + guess + '</b> (voit vaihtaa yllä)';
});

document.getElementById('addBtn').addEventListener('click', ()=>{
  const dateEl = document.getElementById('f-date');
  const descEl = document.getElementById('f-desc');
  const amtEl = document.getElementById('f-amount');
  const catEl = document.getElementById('f-cat');

  const date = dateEl.value || new Date().toISOString().slice(0,10);
  const desc = descEl.value.trim();
  const amount = parseFloat(amtEl.value);

  if (!desc || isNaN(amount) || amount <= 0){
    amtEl.style.borderColor = 'var(--red)';
    setTimeout(()=>{ amtEl.style.borderColor=''; }, 1200);
    return;
  }

  entries.push({
    id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
    date, desc, amount, category: catEl.value
  });
  save();

  const entryMonth = date.slice(0,7);
  viewDate = new Date(entryMonth + '-01T00:00:00');
  descEl.value=''; amtEl.value=''; document.getElementById('catHint').textContent='';
  descEl.focus();
  renderAll();
});

document.getElementById('entryList').addEventListener('click', (e)=>{
  if (e.target.classList.contains('del')){
    const id = e.target.getAttribute('data-id');
    entries = entries.filter(en=>en.id!==id);
    save();
    renderAll();
  }
});

document.getElementById('prevM').addEventListener('click', ()=>{
  viewDate.setMonth(viewDate.getMonth()-1); renderAll();
});
document.getElementById('nextM').addEventListener('click', ()=>{
  viewDate.setMonth(viewDate.getMonth()+1); renderAll();
});

// Init
document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
load();
renderAll();
</script>
</body>
</html>
