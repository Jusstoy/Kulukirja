<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kulukirja</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF1EA; --paper2:#E4E7DD; --ink:#1F2A24; --ink-soft:#54615A;
  --line:#CBD1C4; --green:#2F6B4F; --green-dark:#204B37; --gold:#B8912B;
  --red:#A8452F;
  --c-asuminen:#2F6B4F; --c-ruoka:#B8912B; --c-liikenne:#3E6E8E;
  --c-viihde:#8A4B6E; --c-terveys:#A8452F; --c-vaatteet:#6B6E3E; --c-muut:#7C7C74;
  --c-edenred:#D9822B; --c-liikunta:#1F9E89;
  --c-lainakulut:#3B4F8A; --c-ravintola:#D1495B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1F1B; --paper2:#242923; --ink:#EAEDE6; --ink-soft:#9BA69B; --line:#3A413A;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1F1B; --paper2:#242923; --ink:#EAEDE6; --ink-soft:#9BA69B; --line:#3A413A;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Inter,system-ui,sans-serif; line-height:1.45;
  min-height:100%;
}
.wrap{max-width:980px; margin:0 auto; padding:36px 20px 60px;}
header{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:28px; flex-wrap:wrap;}
h1{font-family:"Source Serif 4",Georgia,serif; font-weight:700; font-size:28px; margin:0;}
h1 span{color:var(--green);}
.header-right{display:flex; align-items:center; gap:10px;}
.month-nav{display:flex; align-items:center; gap:10px; font-family:"IBM Plex Mono",monospace; font-size:14px;}
.month-nav button{
  background:none; border:1px solid var(--line); color:var(--ink); border-radius:6px;
  width:30px; height:30px; cursor:pointer; font-size:15px;
}
.month-label{min-width:120px; text-align:center; font-weight:600;}

.menu-wrap{position:relative;}
.menu-btn{background:none; border:1px solid var(--line); color:var(--ink); border-radius:6px; width:36px; height:36px; cursor:pointer; font-size:16px;}
.menu-dropdown{position:absolute; right:0; top:42px; background:var(--paper2); border:1px solid var(--line); border-radius:8px; min-width:200px; padding:6px; display:none; z-index:40; box-shadow:0 8px 20px rgba(0,0,0,.28);}
.menu-dropdown.open{display:block;}
.menu-dropdown button{display:block; width:100%; text-align:left; padding:9px 10px; border:none; background:none; color:var(--ink); font-size:14px; border-radius:6px; cursor:pointer; font-family:Inter,sans-serif;}
.menu-dropdown button:hover{background:var(--paper);}

.grid{display:grid; grid-template-columns:340px 1fr; gap:24px;}
.grid > div{min-width:0;}
@media (max-width:760px){ .grid{grid-template-columns:minmax(0,1fr);} }

.card{
  background:var(--paper2); border:1px solid var(--line); border-radius:10px; padding:20px;
}
.card + .card{margin-top:20px;}
.card h2{font-family:"Source Serif 4",serif; font-size:16px; margin:0 0 14px; font-weight:700;}

label{display:block; font-size:12.5px; color:var(--ink-soft); margin:12px 0 5px;}
label:first-of-type{margin-top:0;}
input, select{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px;
  background:var(--paper); color:var(--ink); font-family:Inter,sans-serif; font-size:14.5px;
}
input:focus, select:focus{outline:2px solid var(--green); outline-offset:1px;}
input[type=number]{font-family:"IBM Plex Mono",monospace;}
input[type=date]{-webkit-appearance:none; appearance:none; display:block; min-width:0; max-width:100%; height:40px; text-align:left;}
input[type=date]::-webkit-date-and-time-value{text-align:left;}

.btn-sm{padding:8px 11px; border:1px solid var(--line); border-radius:6px; background:none; color:var(--ink); font-size:13px; cursor:pointer; font-family:Inter,sans-serif;}
.btn-sm:hover{border-color:var(--green);}
.card-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.card .card-head h2{margin:0;}
.preset{display:flex; gap:8px; align-items:stretch; margin-bottom:8px;}
.preset .use{flex:1; min-width:0; text-align:left; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); font-size:14px; cursor:pointer; font-family:Inter,sans-serif;}
.preset .use:hover{border-color:var(--green);}
.preset .use b{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.preset .use small{color:var(--ink-soft); font-size:12px;}
.preset .save{flex:1;}
.row2{display:flex; gap:8px;}
.row2 input{flex:1; min-width:0;}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.chip{font-size:12px; padding:3px 4px 3px 10px; border-radius:100px; background:var(--paper); border:1px solid var(--line);}
.chip button{border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:0 4px;}
.chip button:hover{color:var(--red);}

.check-row{display:flex; align-items:center; gap:8px; margin:14px 0 0;}
.check-row input[type=checkbox]{width:17px; height:17px; accent-color:var(--green); cursor:pointer;}
.check-row label{margin:0; font-size:13.5px; color:var(--ink); cursor:pointer;}

.cat-hint{font-size:12px; color:var(--ink-soft); margin-top:6px; min-height:16px;}
.cat-hint b{color:var(--ink);}

button.primary{
  margin-top:16px; width:100%; padding:11px; border:none; border-radius:6px;
  background:var(--green); color:#fff; font-weight:600; font-size:14.5px; cursor:pointer;
}
button.primary:hover{background:var(--green-dark);}

.total-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; flex-wrap:wrap; gap:14px;}
.total-row .amt{font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:600;}
.total-row .lbl{font-size:13px; color:var(--ink-soft);}
.forecast{text-align:right;}
.forecast .amt{font-size:19px; color:var(--gold);}

.bar-row{margin-bottom:12px;}
.bar-row .top{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px;}
.bar-row .top .amt{font-family:"IBM Plex Mono",monospace;}
.bar-track{height:8px; background:var(--paper); border-radius:4px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; border-radius:4px;}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px;}

.entries{width:100%; border-collapse:collapse; table-layout:fixed; font-size:14px;}
.entries td{padding:9px 4px; border-bottom:1px solid var(--line); vertical-align:middle; overflow:hidden;}
.entries tr:last-child td{border-bottom:none;}
.entries td:first-child{padding-left:0;}
.entries td:last-child{padding-right:0;}
.entries .col-date{width:44px; font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}
.entries .col-desc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.entries .col-cat{width:92px;}
.entries .cat-pill{
  display:inline-block; max-width:100%; font-size:11.5px; padding:3px 9px; border-radius:100px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; box-sizing:border-box;
}
.entries .col-amt{width:84px; font-family:"IBM Plex Mono",monospace; font-weight:600; text-align:right; white-space:nowrap;}
.entries .col-amt .note{display:block; font-weight:400; color:var(--ink-soft); font-size:11px; margin-top:2px;}
.entries .col-del{width:26px; text-align:right;}
.entries .del{
  background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:2px 0 2px 6px;
}
.entries .del:hover{color:var(--red);}
.entries .section-label td{
  padding-top:18px; padding-bottom:7px; border-bottom:none; font-size:12px; font-weight:600;
  color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;
}
.empty{color:var(--ink-soft); font-size:14px; padding:20px 0; text-align:center;}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--paper2); border:1px solid var(--line); border-radius:10px; padding:22px; max-width:520px; width:100%;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h2{margin:0; font-family:"Source Serif 4",serif; font-size:18px;}
.modal-head button{background:none; border:none; color:var(--ink-soft); font-size:22px; cursor:pointer; line-height:1;}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:60; max-width:90vw; text-align:center;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kulu<span>kirja</span></h1>
    <div class="header-right">
      <div class="month-nav">
        <button id="prevM" aria-label="Edellinen kuukausi">←</button>
        <span class="month-label" id="monthLabel"></span>
        <button id="nextM" aria-label="Seuraava kuukausi">→</button>
      </div>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" aria-label="Valikko">☰</button>
        <div class="menu-dropdown" id="menuDropdown">
          <button data-view="recurring">Toistuvat kulut</button>
          <button data-view="categories">Kategoriat ja avainsanat</button>
          <button data-view="compare">Kuukausivertailu</button>
        </div>
      </div>
    </div>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Uusi kirjaus</h2>
        <label for="f-date">Päivämäärä</label>
        <input type="date" id="f-date">
        <label for="f-desc">Kuvaus</label>
        <input type="text" id="f-desc" placeholder="esim. K-Market, Elisa lasku...">
        <label for="f-amount">Summa (€)</label>
        <input type="number" id="f-amount" step="0.01" min="0" placeholder="0.00">
        <label for="f-cat">Kategoria</label>
        <select id="f-cat"></select>
        <div class="cat-hint" id="catHint"></div>
        <div class="check-row">
          <input type="checkbox" id="f-shared">
          <label for="f-shared">Yhteinen (lasketaan vain puolet kuluksi)</label>
        </div>
        <button class="primary" id="addBtn">Lisää kirjaus</button>
      </div>

      <div class="card">
        <h2>Vakio-ostos</h2>
        <div id="presetBox"></div>
        <div class="cat-hint">Täytä lomake ja tallenna se vakioksi. Napautus lisää ostoksen tälle päivälle.</div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="total-row">
          <div>
            <div class="lbl">Kuukauden kulut yhteensä</div>
            <div class="amt" id="totalAmt">0,00 €</div>
          </div>
          <div class="forecast" id="forecastBox" style="display:none">
            <div class="lbl" id="forecastLbl">Ennuste koko kuulle</div>
            <div class="amt" id="forecastAmt">0,00 €</div>
          </div>
        </div>
        <div id="bars"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>Kirjaukset</h2>
          <div style="display:flex;gap:8px">
            <button class="btn-sm" id="importBtn">Tuo Excel</button>
            <button class="btn-sm" id="exportBtn">Lataa Excel</button>
          </div>
        </div>
        <input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="display:none">
        <div class="cat-hint" id="exportMsg" style="min-height:0;margin:-6px 0 8px"></div>
        <table class="entries"><tbody id="entryList"></tbody></table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" aria-label="Sulje">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const BASE_CATS = ["Asuminen","Lainakulut","Terveys","Liikenne","Viihde","Edenred","Liikunta","Vaatteet","Ruoka","Ravintola"];
let CATS = [...BASE_CATS, "Muut"];
function colorOf(cat){ return CAT_COLOR[cat] || "var(--c-muut)"; }
const CAT_COLOR = {
  Asuminen:"var(--c-asuminen)", Ruoka:"var(--c-ruoka)", Liikenne:"var(--c-liikenne)",
  Viihde:"var(--c-viihde)", Terveys:"var(--c-terveys)", Vaatteet:"var(--c-vaatteet)", Muut:"var(--c-muut)",
  Edenred:"var(--c-edenred)", Liikunta:"var(--c-liikunta)",
  Lainakulut:"var(--c-lainakulut)", Ravintola:"var(--c-ravintola)"
};
// Kategorioiden erikoissäännöt kulun laskentaan
// Edenred: ensimmäisestä 14 eurosta lasketaan mukaan vain 75%, 14 euron ylittävä osa lasketaan täysimääräisenä
// Yhteinen: kirjauksesta lasketaan kuluksi vain puolet (jaetaan toisen osapuolen kanssa)
function effectiveAmount(e){
  let amt;
  if (e.category === 'Edenred'){
    const capped = Math.min(e.amount, 14);
    const over = Math.max(e.amount - 14, 0);
    amt = capped * 0.75 + over;
  } else {
    amt = e.amount;
  }
  if (e.shared) amt = amt / 2;
  return amt;
}

// Avainsanat -> kategoria (tarkistetaan järjestyksessä, ensimmäinen osuma voittaa).
// Ruoka tarkistetaan ennen Liikennettä, jotta esim. "Uber Eats" osuu Ruokaan eikä Liikenteen "uber"-sanaan.
const KEYWORDS = [
  ["Asuminen", ["vuokra","vastike","sähkö","sahko","vesimaksu","internet","netti","kaukolämpö","kaukolampo","yhtiövastike","yhtiovastike","lämmitys","lammitys","lyhennys"]],
  ["Lainakulut", ["asuntolaina","korko","laina","opintolaina"]],
  ["Terveys", ["apteekki","lääkäri","laakari","hammas","fysioterapia","terveys","optikko","lääke","yths"]],
  ["Ravintola", ["kalja","olut","bisse","safka","ravintola"]],
  ["Ruoka", ["ruoka","kauppa","market","prisma","lidl","alepa","sale","citymarket","kahvila","pizza","wolt","foodora","uber eats"]],
  ["Liikenne", ["bensa","polttoaine","hsl","juna","bussi","taksi","parkki","pysäköinti","pysakointi","autovakuutus","katsastus","abc","vr","bolt","uber"]],
  ["Viihde", ["netflix","spotify","hbo","elokuva","konsertti","peli","steam","disney+","viihde","teatteri"]],
  ["Edenred", ["edenred"]],
  ["Liikunta", ["kuntosali","sali","liikunta"]],
  ["Vaatteet", ["h&m","zara","vaatteet","kengät","kengat","asusteet","vaateliike","vaate","zalando","suit"]],
];

function guessCategory(desc){
  const d = desc.toLowerCase();
  for (const cat of Object.keys(custom.kw)){
    if ((custom.kw[cat] || []).some(w => d.includes(w))) return cat;
  }
  for (const [cat, words] of KEYWORDS){
    if (words.some(w => d.includes(w))) return cat;
  }
  return "Muut";
}

function fmtEUR(n){
  return n.toLocaleString('fi-FI', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ---------- Apufunktiot ----------
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function lsGet(k, fallback){
  try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : fallback; }catch(e){ return fallback; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.error('Tallennus epäonnistui', e); }
}
function flag(el){ el.style.borderColor='var(--red)'; setTimeout(()=>{ el.style.borderColor=''; }, 1200); }
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

// ---------- Kirjaukset ----------
let entries = [];
let viewDate = new Date();
viewDate.setDate(1);

function load(){
  entries = lsGet('kulukirja:entries', []);
}
function save(){ lsSet('kulukirja:entries', entries); }

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
const MONTH_NAMES = ["tammikuu","helmikuu","maaliskuu","huhtikuu","toukokuu","kesäkuu","heinäkuu","elokuu","syyskuu","lokakuu","marraskuu","joulukuu"];

function renderMonthLabel(){
  document.getElementById('monthLabel').textContent = MONTH_NAMES[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
}

function renderAll(){
  renderMonthLabel();
  const mk = monthKey(viewDate);
  const monthEntries = entries.filter(e => e.date.startsWith(mk)).sort((a,b)=> b.date.localeCompare(a.date));

  const total = monthEntries.reduce((s,e)=>s+effectiveAmount(e),0);
  document.getElementById('totalAmt').textContent = fmtEUR(total);

  const forecastBox = document.getElementById('forecastBox');
  const today = new Date();
  const isCurrentMonth = viewDate.getFullYear() === today.getFullYear() && viewDate.getMonth() === today.getMonth();
  if (isCurrentMonth && total > 0){
    const daysElapsed = today.getDate();
    const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
    // Toistuvat kulut (esim. vuokra) ovat jo tiedossa koko kuulle, joten niitä ei ennusteta
    // päiväkeskiarvon kautta - vain kertaluontoiset/vaihtelevat kulut skaalataan jäljellä oleville päiville.
    const recurringTotal = monthEntries.filter(e => e.recurringId).reduce((s,e) => s + effectiveAmount(e), 0);
    const variableTotal = total - recurringTotal;
    const projected = recurringTotal + (variableTotal / daysElapsed) * daysInMonth;
    document.getElementById('forecastAmt').textContent = fmtEUR(projected);
    document.getElementById('forecastLbl').textContent = `Ennuste koko kuulle (pv ${daysElapsed}/${daysInMonth})`;
    forecastBox.style.display = '';
  } else {
    forecastBox.style.display = 'none';
  }

  const byCat = {};
  CATS.forEach(c=>byCat[c]=0);
  monthEntries.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + effectiveAmount(e); });

  const barsEl = document.getElementById('bars');
  barsEl.innerHTML = '';
  CATS.forEach(cat=>{
    const amt = byCat[cat] || 0;
    if (amt === 0 && monthEntries.length > 0) return;
    const pct = total > 0 ? (amt/total*100) : 0;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="top">
        <span><span class="dot" style="background:${colorOf(cat)}"></span>${escapeHtml(cat)}</span>
        <span class="amt">${fmtEUR(amt)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${colorOf(cat)}"></div></div>
    `;
    barsEl.appendChild(row);
  });
  if (monthEntries.length === 0){
    barsEl.innerHTML = '<div class="empty">Ei kirjauksia tälle kuukaudelle vielä.</div>';
  }

  const listEl = document.getElementById('entryList');
  listEl.innerHTML = '';
  if (monthEntries.length === 0){
    listEl.innerHTML = '<tr><td colspan="5" class="empty">Lisää ensimmäinen kirjaus vasemmalta.</td></tr>';
  } else {
    const row = (e) => {
      const tr = document.createElement('tr');
      const d = new Date(e.date);
      const dateStr = d.toLocaleDateString('fi-FI', {day:'2-digit', month:'2-digit'});
      const eff = effectiveAmount(e);
      const note = eff !== e.amount ? `<span class="note">→ ${fmtEUR(eff)}</span>` : '';
      tr.innerHTML = `
        <td class="col-date">${dateStr}</td>
        <td class="col-desc">${escapeHtml(e.desc)}${e.shared ? ' <small style="color:var(--ink-soft);font-weight:400">(yhteinen)</small>' : ''}</td>
        <td class="col-cat"><span class="cat-pill" style="background:${colorOf(e.category)}">${escapeHtml(e.category)}</span></td>
        <td class="col-amt">${fmtEUR(e.amount)}${note}</td>
        <td class="col-del"><button class="del" data-id="${e.id}" aria-label="Poista">✕</button></td>
      `;
      return tr;
    };
    const normal = monthEntries.filter(e => !e.recurringId);
    const recurringRows = monthEntries.filter(e => e.recurringId);
    normal.forEach(e => listEl.appendChild(row(e)));
    if (recurringRows.length){
      const label = document.createElement('tr');
      label.className = 'section-label';
      label.innerHTML = '<td colspan="5">Kuukausikulut</td>';
      listEl.appendChild(label);
      recurringRows.forEach(e => listEl.appendChild(row(e)));
    }
  }
}

function addEntry({date, desc, amount, category, recurringId, shared}, opts={}){
  const entry = { id: Date.now()+'-'+Math.random().toString(36).slice(2,7), date, desc, amount, category };
  if (recurringId) entry.recurringId = recurringId;
  if (shared) entry.shared = true;
  entries.push(entry);
  save();
  viewDate = new Date(date.slice(0,7) + '-01T00:00:00');
  renderAll();
  if (!opts.silent) toast('Lisätty kuluihin: ' + desc + ' · ' + fmtEUR(amount));
}

document.getElementById('f-desc').addEventListener('input', (e)=>{
  const val = e.target.value.trim();
  const hint = document.getElementById('catHint');
  if (val.length < 2){ hint.textContent=''; return; }
  const guess = guessCategory(val);
  document.getElementById('f-cat').value = guess;
  hint.innerHTML = 'Ehdotettu kategoria: <b>' + guess + '</b> (voit vaihtaa yllä)';
});

document.getElementById('addBtn').addEventListener('click', ()=>{
  const dateEl = document.getElementById('f-date');
  const descEl = document.getElementById('f-desc');
  const amtEl = document.getElementById('f-amount');
  const catEl = document.getElementById('f-cat');
  const date = dateEl.value || todayISO();
  const desc = descEl.value.trim();
  const amount = parseFloat(amtEl.value);
  const sharedEl = document.getElementById('f-shared');
  if (!desc || isNaN(amount) || amount <= 0){ flag(amtEl); return; }
  addEntry({date, desc, amount, category: catEl.value, shared: sharedEl.checked});
  descEl.value=''; amtEl.value=''; sharedEl.checked=false; document.getElementById('catHint').textContent='';
  descEl.focus();
});

document.getElementById('entryList').addEventListener('click', (e)=>{
  if (e.target.classList.contains('del')){
    entries = entries.filter(en=>en.id!==e.target.getAttribute('data-id'));
    save(); renderAll();
  }
});
document.getElementById('prevM').addEventListener('click', ()=>{ viewDate.setMonth(viewDate.getMonth()-1); renderAll(); });
document.getElementById('nextM').addEventListener('click', ()=>{ viewDate.setMonth(viewDate.getMonth()+1); renderAll(); });

// ---------- Omat kategoriat ja avainsanat ----------
const PALETTE = ["#5B6FB5","#B5567A","#4F8F8F","#9A6B3A","#7A5BA8","#5E8C3A"];
let custom = lsGet('kulukirja:custom', {cats:[], kw:{}});
custom.cats = custom.cats || []; custom.kw = custom.kw || {};

function fillSelect(sel){
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '';
  CATS.forEach(c => sel.add(new Option(c, c)));
  if (CATS.includes(cur)) sel.value = cur;
}
function refreshCats(){
  CATS = [...BASE_CATS, ...custom.cats.map(c=>c.name), "Muut"];
  custom.cats.forEach(c => { CAT_COLOR[c.name] = c.color; });
  fillSelect(document.getElementById('f-cat'));
  fillSelect(document.getElementById('s-kwcat'));
  fillSelect(document.getElementById('r-cat'));
}
function setMsg(t){ const el = document.getElementById('setMsg'); if (el) el.textContent = t; }

function renderCustom(){
  const el = document.getElementById('customList');
  if (!el) return;
  el.innerHTML = '';
  const chip = (label, onDel) => {
    const s = document.createElement('span'); s.className = 'chip';
    s.appendChild(document.createTextNode(label + ' '));
    const b = document.createElement('button'); b.textContent = '✕'; b.setAttribute('aria-label','Poista');
    b.onclick = onDel; s.appendChild(b); el.appendChild(s);
  };
  custom.cats.forEach(c => chip('Kategoria: ' + c.name, () => delCat(c.name)));
  Object.keys(custom.kw).forEach(cat => custom.kw[cat].forEach(w => chip(cat + ': ' + w, () => delKw(cat, w))));
  if (!el.children.length) el.innerHTML = '<span class="cat-hint">Ei omia lisäyksiä vielä.</span>';
}
function delCat(name){
  if (entries.some(e => e.category === name)) return setMsg('Kategoriaa "'+name+'" käytetään kirjauksissa, joten sitä ei voi poistaa.');
  custom.cats = custom.cats.filter(c => c.name !== name);
  delete custom.kw[name];
  if (preset && preset.category === name) preset.category = 'Muut';
  recurring = recurring.map(r => r.category===name ? {...r, category:'Muut'} : r);
  lsSet('kulukirja:preset', preset);
  lsSet('kulukirja:recurring', recurring);
  lsSet('kulukirja:custom', custom);
  refreshCats(); renderCustom(); renderPreset(); renderAll();
}
function delKw(cat, w){
  custom.kw[cat] = (custom.kw[cat] || []).filter(x => x !== w);
  if (!custom.kw[cat].length) delete custom.kw[cat];
  lsSet('kulukirja:custom', custom); renderCustom();
}

// ---------- Vakio-ostos (yksi) ----------
let preset = lsGet('kulukirja:preset', null);
if (!preset){
  const old = lsGet('kulukirja:presets', null);
  if (Array.isArray(old) && old[0]) preset = old[0];
}
function renderPreset(){
  const el = document.getElementById('presetBox');
  el.innerHTML = '';
  if (preset){
    const row = document.createElement('div'); row.className='preset';
    const use = document.createElement('button'); use.className='use';
    use.innerHTML = `<b>+ ${escapeHtml(preset.desc)}</b><small>${fmtEUR(preset.amount)} · ${escapeHtml(preset.category)} · tälle päivälle</small>`;
    use.onclick = () => addEntry({date: todayISO(), desc: preset.desc, amount: preset.amount, category: CATS.includes(preset.category) ? preset.category : 'Muut'});
    const clr = document.createElement('button'); clr.className='btn-sm'; clr.textContent='✕';
    clr.setAttribute('aria-label','Tyhjennä vakio-ostos');
    clr.onclick = () => { preset = null; lsSet('kulukirja:preset', preset); renderPreset(); };
    row.append(use, clr); el.appendChild(row);
  } else {
    const sv = document.createElement('button'); sv.className='btn-sm save'; sv.style.width='100%';
    sv.textContent = 'Tallenna lomakkeesta vakioksi';
    sv.onclick = () => {
      const desc = document.getElementById('f-desc').value.trim();
      const amountEl = document.getElementById('f-amount');
      const amount = parseFloat(amountEl.value);
      if (!desc || isNaN(amount) || amount <= 0){ flag(amountEl); return; }
      preset = {desc, amount, category: document.getElementById('f-cat').value};
      lsSet('kulukirja:preset', preset); renderPreset();
    };
    el.appendChild(sv);
  }
}

// ---------- Toistuvat kulut ----------
let recurring = lsGet('kulukirja:recurring', []);
function recurringHTML(){
  return `
    <label for="r-desc">Kuvaus</label>
    <input type="text" id="r-desc" placeholder="esim. Vuokra">
    <label for="r-amount">Summa (€)</label>
    <input type="number" id="r-amount" step="0.01" min="0" placeholder="0.00">
    <label for="r-cat">Kategoria</label>
    <select id="r-cat"></select>
    <label for="r-day">Eräpäivä (kuukauden päivä)</label>
    <input type="number" id="r-day" min="1" max="28" value="1">
    <button class="btn-sm" id="r-add" style="margin-top:12px;width:100%">Tallenna toistuva kulu</button>
    <div class="cat-hint" id="r-msg"></div>
    <div id="r-list" style="margin-top:14px"></div>
  `;
}
function renderRecurringList(){
  const el = document.getElementById('r-list');
  if (!el) return;
  if (!recurring.length){ el.innerHTML = '<div class="cat-hint">Ei toistuvia kuluja vielä.</div>'; return; }
  el.innerHTML = recurring.map(r => `
    <div class="preset">
      <button class="use" data-add="${r.id}"><b>${escapeHtml(r.desc)}</b><small>${fmtEUR(r.amount)} · ${escapeHtml(r.category)} · pv ${r.day}</small></button>
      <button class="btn-sm" data-del="${r.id}" aria-label="Poista">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', ()=>{
    const r = recurring.find(x=>x.id===b.dataset.add);
    if (!r) return;
    const d = new Date(viewDate.getFullYear(), viewDate.getMonth(), Math.min(r.day, 28));
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    addEntry({date: dateStr, desc: r.desc, amount: r.amount, category: CATS.includes(r.category) ? r.category : 'Muut', recurringId: r.id});
  }));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', ()=>{
    recurring = recurring.filter(x=>x.id!==b.dataset.del);
    lsSet('kulukirja:recurring', recurring);
    renderRecurringList();
  }));
}
function bindRecurring(){
  fillSelect(document.getElementById('r-cat'));
  renderRecurringList();
  document.getElementById('r-add').addEventListener('click', ()=>{
    const desc = document.getElementById('r-desc').value.trim();
    const amount = parseFloat(document.getElementById('r-amount').value);
    const category = document.getElementById('r-cat').value;
    const day = Math.min(28, Math.max(1, parseInt(document.getElementById('r-day').value) || 1));
    const msg = document.getElementById('r-msg');
    if (!desc || isNaN(amount) || amount<=0){ msg.textContent='Täytä kuvaus ja summa.'; return; }
    recurring.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,6), desc, amount, category, day});
    lsSet('kulukirja:recurring', recurring);
    document.getElementById('r-desc').value=''; document.getElementById('r-amount').value='';
    msg.textContent = 'Tallennettu.';
    renderRecurringList();
  });
}

// Lisää puuttuvat toistuvat kulut automaattisesti kuluvalle kuukaudelle, kun sovellus avataan
function autoAddRecurring(){
  if (!recurring.length) return;
  const today = new Date();
  const curKey = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  const added = [];
  recurring.forEach(r=>{
    const already = entries.some(e => e.recurringId === r.id && e.date.startsWith(curKey));
    if (already) return;
    const lastDay = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
    const day = Math.min(r.day, lastDay);
    const d = new Date(today.getFullYear(), today.getMonth(), day);
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    addEntry({date: dateStr, desc: r.desc, amount: r.amount, category: CATS.includes(r.category) ? r.category : 'Muut', recurringId: r.id}, {silent:true});
    added.push(r.desc);
  });
  if (added.length){
    viewDate = new Date(curKey + '-01T00:00:00');
    renderAll();
    toast(added.length === 1 ? `${added[0]} lisätty automaattisesti.` : `${added.length} toistuvaa kulua lisätty automaattisesti.`);
  }
}

// ---------- Kategoriat-modaali ----------
function categoriesHTML(){
  return `
    <label for="s-newcat">Uusi kategoria</label>
    <div class="row2"><input type="text" id="s-newcat" placeholder="esim. Lemmikit"><button class="btn-sm" id="s-addcat">Lisää</button></div>
    <label for="s-kwcat">Uusi avainsana kategoriaan</label>
    <select id="s-kwcat"></select>
    <div class="row2" style="margin-top:8px"><input type="text" id="s-kw" placeholder="esim. eläinlääkäri"><button class="btn-sm" id="s-addkw">Lisää</button></div>
    <div class="cat-hint" id="setMsg">Avainsana osuu myös sanan osaan, esim. "vaate" tunnistaa "vaatteet".</div>
    <div class="chips" id="customList"></div>
  `;
}
function bindCategories(){
  fillSelect(document.getElementById('s-kwcat'));
  renderCustom();
  document.getElementById('s-addcat').addEventListener('click', ()=>{
    const inp = document.getElementById('s-newcat');
    const name = inp.value.trim();
    if (!name) return setMsg('Kirjoita kategorian nimi.');
    if (name.length > 24) return setMsg('Nimi on liian pitkä (enintään 24 merkkiä).');
    if (CATS.some(c => c.toLowerCase() === name.toLowerCase())) return setMsg('Kategoria on jo olemassa.');
    custom.cats.push({name, color: PALETTE[custom.cats.length % PALETTE.length]});
    lsSet('kulukirja:custom', custom);
    inp.value = '';
    refreshCats(); renderCustom(); renderAll();
    document.getElementById('s-kwcat').value = name;
    setMsg('Kategoria "' + name + '" lisätty. Voit nyt lisätä sille avainsanoja.');
  });
  document.getElementById('s-addkw').addEventListener('click', ()=>{
    const cat = document.getElementById('s-kwcat').value;
    const inp = document.getElementById('s-kw');
    const w = inp.value.trim().toLowerCase();
    if (!w) return setMsg('Kirjoita avainsana.');
    if (cat === 'Muut') return setMsg('Muut on oletuskategoria, valitse jokin toinen.');
    const list = custom.kw[cat] || (custom.kw[cat] = []);
    if (list.includes(w)) return setMsg('Avainsana on jo lisätty.');
    list.push(w);
    lsSet('kulukirja:custom', custom);
    inp.value = '';
    renderCustom(); setMsg('Avainsana "' + w + '" lisätty kategoriaan ' + cat + '.');
  });
}

// ---------- Kuukausivertailu-modaali ----------
function compareHTML(){ return '<div id="cmp-list"></div>'; }
function renderCompare(){
  const el = document.getElementById('cmp-list');
  if (!el) return;
  const byMonth = {};
  entries.forEach(e => { const mk = e.date.slice(0,7); byMonth[mk] = (byMonth[mk]||0) + effectiveAmount(e); });
  const months = Object.keys(byMonth).sort();
  if (!months.length){ el.innerHTML = '<div class="cat-hint">Ei vielä kirjauksia vertailtavaksi.</div>'; return; }
  const max = Math.max(...Object.values(byMonth));
  const curKey = monthKey(viewDate);
  el.innerHTML = months.map(m => {
    const [y,mo] = m.split('-');
    const label = MONTH_NAMES[parseInt(mo)-1] + ' ' + y;
    const amt = byMonth[m];
    const pct = max>0 ? (amt/max*100) : 0;
    const isCur = m===curKey;
    return `
      <div class="bar-row">
        <div class="top"><span style="${isCur?'font-weight:700':''}">${label}${isCur?' (nyt)':''}</span><span class="amt">${fmtEUR(amt)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${isCur?'var(--green)':'var(--c-liikenne)'}"></div></div>
      </div>`;
  }).join('');
}

// ---------- Valikko ja modaali ----------
function openModal(view){
  const titles = {recurring:'Toistuvat kulut', categories:'Kategoriat ja avainsanat', compare:'Kuukausivertailu'};
  document.getElementById('modalTitle').textContent = titles[view];
  const body = document.getElementById('modalBody');
  if (view==='recurring') body.innerHTML = recurringHTML();
  if (view==='categories') body.innerHTML = categoriesHTML();
  if (view==='compare') body.innerHTML = compareHTML();
  document.getElementById('modalOverlay').classList.add('open');
  if (view==='recurring') bindRecurring();
  if (view==='categories') bindCategories();
  if (view==='compare') renderCompare();
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if (e.target.id==='modalOverlay') closeModal(); });
document.getElementById('menuBtn').addEventListener('click', (e)=>{ e.stopPropagation(); document.getElementById('menuDropdown').classList.toggle('open'); });
document.addEventListener('click', ()=> document.getElementById('menuDropdown').classList.remove('open'));
document.getElementById('menuDropdown').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-view]');
  if (!btn) return;
  document.getElementById('menuDropdown').classList.remove('open');
  openModal(btn.dataset.view);
});

// ---------- Excel-vienti ----------
const r2 = n => Math.round(n * 100) / 100;
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const msg = document.getElementById('exportMsg');
  if (!entries.length){ msg.textContent = 'Ei kirjauksia vietäväksi.'; setTimeout(()=>{ msg.textContent=''; }, 2500); return; }
  const sorted = [...entries].sort((a,b) => a.date.localeCompare(b.date));
  const rows = [["Päivämäärä","Kuvaus","Kategoria","Summa (€)","Yhteinen","Laskettu summa (€)"]];
  sorted.forEach(e => rows.push([e.date, e.desc, e.category, r2(e.amount), e.shared ? "Kyllä" : "Ei", r2(effectiveAmount(e))]));

  const months = [...new Set(sorted.map(e => e.date.slice(0,7)))];
  const cats = CATS.filter(c => sorted.some(e => e.category === c));
  const sum = [["Kuukausi", ...cats, "Yhteensä"]];
  months.forEach(m => {
    const es = sorted.filter(e => e.date.startsWith(m));
    const vals = cats.map(c => r2(es.filter(e => e.category === c).reduce((s,e) => s + effectiveAmount(e), 0)));
    sum.push([m, ...vals, r2(vals.reduce((a,b) => a + b, 0))]);
  });

  const fname = 'kulukirja-' + todayISO();
  if (typeof XLSX !== 'undefined'){
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet(rows);
    ws1['!cols'] = [{wch:12},{wch:32},{wch:14},{wch:12},{wch:10},{wch:18}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Kirjaukset');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), 'Yhteenveto');
    XLSX.writeFile(wb, fname + '.xlsx');
  } else {
    const cell = v => typeof v === 'number' ? String(v).replace('.', ',') : '"' + String(v).replace(/"/g,'""') + '"';
    const csv = '\ufeff' + rows.map(r => r.map(cell).join(';')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = fname + '.csv'; a.click();
  }
});

// ---------- Excel-tuonti ----------
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (ev)=>{
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheetName = wb.SheetNames.includes('Kirjaukset') ? 'Kirjaukset' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1});
      let count = 0;
      rows.forEach((row, i) => {
        if (i===0 || !row || !row.length) return;
        let [dateRaw, desc, category, amountRaw] = row;
        if (!desc || amountRaw===undefined || amountRaw===null || amountRaw==='') return;
        let dateStr;
        if (dateRaw instanceof Date){
          dateStr = dateRaw.getFullYear()+'-'+String(dateRaw.getMonth()+1).padStart(2,'0')+'-'+String(dateRaw.getDate()).padStart(2,'0');
        } else {
          const s = String(dateRaw||'').trim();
          dateStr = /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0,10) : todayISO();
        }
        const amount = parseFloat(String(amountRaw).replace(',', '.'));
        if (isNaN(amount) || amount<=0) return;
        category = (category || '').toString().trim() || 'Muut';
        if (category!=='Muut' && !CATS.includes(category)){
          custom.cats.push({name: category, color: PALETTE[custom.cats.length % PALETTE.length]});
          lsSet('kulukirja:custom', custom);
          refreshCats();
        }
        entries.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7)+'-'+count, date: dateStr, desc: String(desc).trim(), amount, category});
        count++;
      });
      save(); renderAll();
      toast(count ? `Tuotu ${count} kirjausta.` : 'Ei tuotavia rivejä tiedostossa.');
    }catch(err){
      console.error(err);
      toast('Tiedoston lukeminen epäonnistui.');
    }
    ev.target.value = '';
  };
  reader.readAsArrayBuffer(file);
});

// ---------- Alustus ----------
document.getElementById('f-date').value = todayISO();
load();
refreshCats();
renderPreset();
renderAll();
autoAddRecurring();
</script>
